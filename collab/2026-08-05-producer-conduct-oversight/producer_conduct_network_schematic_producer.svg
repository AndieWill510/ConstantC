<text x="82" y="735" class="callout-title">Interpretive boundary</text>
<text x="82" y="765" class="caption">Connectivity reveals recurrence, action diversity, and pathway complexity.</text>
<text x="82" y="795" class="caption">It may also reflect time observed, duplication, or thorough case handling.</text>
<text x="82" y="825" class="caption">Degree is not guilt. The graph surfaces the question; evidence answers it.</text>
<text x="1060" y="862" class="small">No guilt by graph. Every edge should remain traceable to source evidence.</text>
